# clone tpm: git clone https://github.com/tmux-plugins/tpm.git ~/.config/tmux/plugins/tpm

# ---------- Navigation ----------
# smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"

# navigating vim/tmux panes with Ctrl + vim keys
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# navigating vim/tmux panes with Ctrl + arrow keys
bind-key -n 'C-Left'    if-shell "$is_vim" 'send-keys C-Left'   'select-pane -L'
bind-key -n 'C-Down'    if-shell "$is_vim" 'send-keys C-Down'   'select-pane -D'
bind-key -n 'C-Up'      if-shell "$is_vim" 'send-keys C-Up'     'select-pane -U'
bind-key -n 'C-Right'   if-shell "$is_vim" 'send-keys C-Right'  'select-pane -R'

# navigating splits with Alt + arrow keys (tmux-only)
# bind -n M-Left select-pane -L
# bind -n M-Right select-pane -R
# bind -n M-Up select-pane -U
# bind -n M-Down select-pane -D

# window navigation with Shift + arrow keys
bind -n S-Left previous-window
bind -n S-Right next-window

# copy mode navigation
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# Set vi mode
set -g mode-keys vi

# ---------- Settings ----------
# set the prefix to `ctrl + space` instead of `ctrl + b`
# unbind C-Space
# set-option -g prefix C-Space
# bind-key C-Space send-prefix

# use r to quickly reload tmux settings
unbind r
bind r source-file ~/.config/tmux/tmux.conf; display 'Reloaded TMUX config'

# open ~/.tmux.conf in vim and reload settings on quit
unbind e
bind e new-window -n '~/.config/tmux/tmux.conf' "sh -c 'nvim ~/.config/tmux/tmux.conf && tmux source ~/.config/tmux/tmux.conf'"

# use | and - to split windows vertically and horizontally instead of " and % respoectively
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# use a to toggle synchronize panes
bind a set-window-option synchronize-panes

# set default terminal to xterm-256color
# set -g default-terminal "xterm-256color"
set -g default-terminal "tmux-256color"
# enable true color
set -ag terminal-overrides ",xterm-256color:RGB"
# set -sa terminal-overrides ",xterm*:Tc"

# set history limit so we get lots of scrollback.
setw -g history-limit 50000000

# create a new session from within an existing session
bind-key n command-prompt "new-session -s '%%'"

# ---------- Mouse ----------
# use m to toggle mouse mode
# unbind m
# bind m setw mouse
# enable mouse control
set -g mouse on

# ---------- Status Bar ----------
# refresh status line every N seconds
set -g status-interval 1
# start window indices at 1
set -g base-index 1
# start pane indices at 1
set -g pane-base-index 1
# automatically renumbers window indexes
set-option -g renumber-windows on
# automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles off

# length of tmux status line segments
set -g status-left-length 200
set -g status-right-length 200

# status bar status
set-option -g status "on"
set-option -g status-justify "left"
# status bar position
set -g status-position bottom
# status left
set -g status-left "[#S] "
# status right
set-option -g status-right "| #W | #H | #(whoami) | %d-%b-%Y | %H:%M:%S |"

# ---------- yanking ----------
# * setup 'v' to begin selection, just like Vim
bind-key -T copy-mode-vi 'v' send -X begin-selection
# * setup 'y' to copy selecton
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
# setup 'r to toggle between rectange and line select
bind-key -T copy-mode-vi 'r' send -X rectangle-toggle

# ---------- TPM ----------
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# plugins
set -g @plugin 'christoomey/vim-tmux-navigator'     # navigate panes, windows
set -g @plugin 'noscript/tmux-mighty-scroll'        # seamless mouse scrolling
set -g @plugin 'tmux-plugins/tmux-resurrect'        # persist tmux session after computer restarts
set -g @plugin 'tmux-plugins/tmux-continuum'        # automatically save session every 15 min

# ---------- tmux resurrect ----------
# for vim
set -g @resurrect-strategy-vim 'session'
# for neovim
set -g @resurrect-strategy-nvim 'session'

# ---------- tmux continuum ----------
set -g @continuum-restore 'on'

# ---------- catppuccin colorscheme ----------
set -g @plugin 'catppuccin/tmux#v2.3.2'             # catppuccin theme

# Catppuccin settings (must be set BEFORE the plugin loads)
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'basic'    # basic | rounded | slanted

# Status bar basics
set -g status-position bottom
set -g status-interval 1
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g status-left-length 100
set -g status-right-length 150

# Left: session name > current dir name
set -g status-left ""
set -ag status-left "#[fg=#{@thm_crust},bg=#{@thm_green},bold] #S "
set -ag status-left "#[fg=#{@thm_green},bg=#{@thm_bg}]"
set -ag status-left "#[bg=#{@thm_bg}] "

set -g @catppuccin_window_text " #{b:pane_current_path}"

# current active window
set -g @catppuccin_window_current_text_color "#{@thm_mauve}"
set -g @catppuccin_window_current_text "#[fg=#{@thm_crust}, bg=#{@thm_mauve}] #{b:pane_current_path}"

# Right (left to right): shell, host, user, date, time
set -g status-right ""
# shell
set -ag status-right "#[fg=#{@thm_mauve},bg=#{@thm_bg}]"
set -ag status-right "#[fg=#{@thm_crust},bg=#{@thm_mauve}] #{b:default-shell} "
set -ag status-right "#[bg=#{@thm_bg}] "
# hostname
set -ag status-right "#[fg=#{@thm_blue},bg=#{@thm_mauve}]"
set -ag status-right "#[fg=#{@thm_crust},bg=#{@thm_blue}] #h "
set -ag status-right "#[bg=#{@thm_bg}] "
# user
set -ag status-right "#[fg=#{@thm_sapphire},bg=#{@thm_blue}]"
set -ag status-right "#[fg=#{@thm_crust},bg=#{@thm_sapphire}] #(whoami) "
set -ag status-right "#[bg=#{@thm_bg}] "
# date time
set -ag status-right "#[fg=#{@thm_teal},bg=#{@thm_sapphire}]"
set -ag status-right "#[fg=#{@thm_crust},bg=#{@thm_teal}] %d-%b-%Y "
set -ag status-right "#[fg=#{@thm_green},bg=#{@thm_teal}]"
set -ag status-right "#[bg=#{@thm_bg}] "
set -ag status-right "#[fg=#{@thm_crust},bg=#{@thm_green},bold] %H:%M:%S "

# --- Keep this at the very bottom ---
run '~/.tmux/plugins/tpm/tpm'



# Initialize tpm (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'


